# FedSearch-lite local stack. Run `make gen` first so ../out exists.
#   MinIO       → S3 archive (cold tier, Parquet)      console: http://localhost:9001
#   OpenSearch  → SIEM stand-in (hot tier)             api:     http://localhost:9200
#   Postgres    → Reef stand-in (temporal context)     psql:    localhost:5432/reef
name: fedsearch

services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fedsearch
      MINIO_ROOT_PASSWORD: fedsearch-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    volumes: ["../out/cold:/seed:ro"]
    entrypoint: >
      /bin/sh -c "
      mc alias set s3 http://minio:9000 fedsearch fedsearch-secret &&
      mc mb --ignore-existing s3/telemetry-archive &&
      mc mirror --overwrite --quiet /seed s3/telemetry-archive/ocsf &&
      mc du s3/telemetry-archive/ocsf"

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ports: ["9200:9200"]
    volumes: [os-data:/usr/share/opensearch/data]
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health?wait_for_status=yellow || exit 1"]
      interval: 5s
      retries: 30

  opensearch-init:
    image: curlimages/curl:latest
    depends_on:
      opensearch: { condition: service_healthy }
    volumes: ["../out/hot:/seed:ro", "./opensearch:/init:ro"]
    entrypoint: ["/bin/sh", "/init/load.sh"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fedsearch
      POSTGRES_PASSWORD: fedsearch
      POSTGRES_DB: reef
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../out/context:/seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fedsearch -d reef"]
      interval: 3s
      retries: 20

volumes:
  minio-data:
  os-data:
  pg-data:
